<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для тебя</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffeef2; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        .container { text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 85%; position: relative; }
        h1 { color: #d63384; font-size: 22px; margin-bottom: 20px; }
        .buttons { display: flex; justify-content: center; gap: 20px; min-height: 60px; }
        button { padding: 15px 25px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #6c757d; color: white; position: absolute; }
        #heart { font-size: 80px; display: none; animation: beat 0.8s infinite; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        #happyText { display: none; color: #d63384; margin-top: 15px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="q">Ты будешь со мной встречаться?</h1>
        <div class="buttons" id="btns">
            <button id="yesBtn">ДА!</button>
            <button id="noBtn">Нет</button>
        </div>
        <div id="heart">❤️</div>
        <h2 id="happyText">Ура! ❤️</h2>
    </div>
    <script>
        const no = document.getElementById('noBtn');
        const yes = document.getElementById('yesBtn');
        function move() {
            const x = Math.random() * (window.innerWidth - no.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - no.offsetHeight - 20);
            no.style.position = 'fixed';
            no.style.left = Math.max(10, x) + 'px';
            no.style.top = Math.max(10, y) + 'px';
        }
        no.addEventListener('touchstart', (e) => { e.preventDefault(); move(); });
        no.addEventListener('mouseover', move);
        yes.onclick = () => {
            document.getElementById('q').style.display = 'none';
            document.getElementById('btns').style.display = 'none';
            document.getElementById('heart').style.display = 'block';
            document.getElementById('happyText').style.display = 'block';
            document.body.style.backgroundColor = '#ffb3c1';
        };
    </script>
</body>
</html>
